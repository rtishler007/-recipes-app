<style>
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --surface-2: #f2eee8;
    --text: #22201c;
    --muted: #6f6a62;
    --border: #e4ded4;
    --accent: #c4552d;
    --accent-soft: #fbe9e1;
    --accent-text: #ffffff;
    --ok: #2f7d4f;
    --warn-bg: #fff4d6;
    --warn-text: #7a5a00;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #22201d;
      --surface-2: #2c2a26;
      --text: #efebe4;
      --muted: #a39d93;
      --border: #3a3732;
      --accent: #e0774f;
      --accent-soft: #3a2a22;
      --accent-text: #1a1a1a;
      --ok: #6cc08e;
      --warn-bg: #3a3220;
      --warn-text: #f0d68a;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  /* ---- כותרת עליונה ---- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    min-height: 54px;
  }
  .topbar h1 {
    flex: 1;
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn, .text-btn {
    border: 0;
    background: none;
    padding: 6px 8px;
    border-radius: 8px;
    color: var(--accent);
    font-weight: 500;
  }
  .icon-btn { font-size: 22px; line-height: 1; }

  /* ---- אזור התוכן ---- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }

  /* ---- סרגל ניווט תחתון ---- */
  .tabbar {
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1;
    border: 0;
    background: none;
    padding: 8px 0 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 20px;
    color: var(--muted);
  }
  .tab span { font-size: 12px; }
  .tab.active { color: var(--accent); }

  /* ---- צ'אט ---- */
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    background: var(--accent);
    color: var(--accent-text);
    margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .bubble.assistant {
    background: var(--surface);
    border: 1px solid var(--border);
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .typing { color: var(--muted); font-style: italic; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 8px;
  }
  .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px;
  }

  .banner {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 14px;
  }

  .composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 9px 14px;
    background: var(--bg);
    max-height: 140px;
    font-size: 16px; /* 16px מונע זום אוטומטי באייפון */
  }
  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 18px;
    transform: scaleX(-1); /* החץ מצביע שמאלה, בכיוון הכתיבה */
  }
  .send-btn:disabled { opacity: .4; }

  /* ---- כרטיסים ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 4px; font-size: 17px; }
  .meta { color: var(--muted); font-size: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: 500;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.danger { color: #c0392b; }
  .btn.confirming { background: #c0392b; border-color: #c0392b; color: #fff; }
  .btn:disabled { opacity: .5; }

  .warn {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    margin-top: 10px;
  }

  /* ---- רשימת מתכונים ---- */
  .search {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    background: var(--surface);
    margin-bottom: 14px;
    font-size: 16px;
  }
  .recipe-item { display: block; width: 100%; text-align: right; }
  .tag {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 1px 10px;
    font-size: 12px;
    font-weight: 500;
    margin-left: 6px;
  }

  /* ---- מסך מתכון ---- */
  .segmented {
    display: flex;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 4px;
    margin: 14px 0;
  }
  .segmented button {
    flex: 1;
    border: 0;
    background: none;
    border-radius: 9px;
    padding: 8px 0;
    font-weight: 500;
    color: var(--muted);
  }
  .segmented button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .ing-list { list-style: none; margin: 0; padding: 0; }
  .ing-list li { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .ing-list li:last-child { border-bottom: 0; }
  .amount { font-weight: 700; }

  /* ---- תצוגת משימות ---- */
  .progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 6px 0 14px; }
  .progress div { height: 100%; background: var(--ok); transition: width .2s; }
  .task { display: flex; gap: 12px; align-items: flex-start; }
  .task input[type=checkbox] { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--ok); flex-shrink: 0; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-weight: 700; }
  .task.done .task-title, .task.done .task-text { text-decoration: line-through; color: var(--muted); }
  .task-text { margin: 4px 0; }
  .inputs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .inputs span { background: var(--surface-2); border-radius: 8px; padding: 1px 8px; font-size: 13px; }
  .timer {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .timer .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; min-width: 64px; display: inline-block; text-align: center; }
  .timer.finished .time { color: #fff; background: var(--accent); border-radius: 8px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* ---- תצוגת מטריצה ---- */
  .matrix-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
  table.matrix { border-collapse: collapse; font-size: 13px; line-height: 1.35; min-width: 100%; }
  .matrix td {
    border: 1px solid var(--border);
    padding: 6px;
    vertical-align: middle;
    min-width: 64px;
  }
  .matrix td.ing { min-width: 92px; }
  .matrix td.ing { background: var(--surface); }
  .matrix td.step { background: var(--accent-soft); font-weight: 500; cursor: pointer; }
  .matrix td.step small { display: block; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .matrix td.filler { background: var(--surface-2); border-left-color: transparent; border-right-color: transparent; }
  .matrix td.serve { background: var(--accent); color: var(--accent-text); font-weight: 700; text-align: center; }
  .notes { font-size: 14px; color: var(--muted); margin-bottom: 10px; }

  /* ---- טופס עריכה ---- */
  .form label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .form input, .form textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    background: var(--bg);
    font-size: 16px;
  }
  .form .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .toast {
    position: fixed;
    bottom: 90px;
    left: 16px;
    right: 16px;
    max-width: 560px;
    margin: 0 auto;
    background: #333;
    color: #fff;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 10;
  }
  .toast.error { background: #b03a2e; }
  .loading { text-align: center; color: var(--muted); padding: 24px; }
</style>
